<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Melody Maker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f7ff;
      text-align: center;
      padding: 20px;
    }

    h1 { color: #333; margin: 0 0 10px; }
    h2 { color: #333; margin: 22px 0 10px; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin: 12px 0 16px;
    }

    .chip {
      background: white;
      border: 1px solid #d9e2ff;
      border-radius: 999px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 14px;
      color: #333;
    }

    input[type="range"] { width: 240px; }

    select {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #c9d6ff;
      background: #fff;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #4f7cff;
      color: white;
    }

    button:hover { background: #365edc; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .rollWrap {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 10px;
      margin: 0 auto;
      max-width: 95vw;
    }

    .frame {
      background: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-sizing: border-box;
    }

    .noteLabels {
      width: 88px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .noteLabel {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      border-bottom: 1px solid #eee;
      user-select: none;
    }

    canvas {
      display: block;
      background: white;
      border-radius: 8px;
    }

    .headerCanvas {
      border-bottom: 1px solid #eee;
      border-radius: 8px 8px 0 0;
    }

    .gridCanvas {
      border-radius: 0 0 8px 8px;
    }

    .labelHeaderSpacer {
      height: 32px;
      border-bottom: 1px solid #eee;
      border-radius: 10px 10px 0 0;
      box-sizing: border-box;
      background: #fff;
    }

    .section { margin-top: 18px; }

    .pager {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 10px 0 6px;
    }

    .pill {
      background: white;
      border: 1px solid #d9e2ff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      color: #222;
      min-width: 220px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Kids Melody Maker</h1>

  <div class="controls">
    <div class="chip" title="Tempo">
      <label for="tempo">Tempo</label>
      <input id="tempo" type="range" min="50" max="160" value="90" />
      <span id="tempoValue">90</span>
    </div>

    <div class="chip" title="Note range">
      <label for="range">Melody Range</label>
      <select id="range">
        <option value="oneOctave" selected>One Octave (C-B)</option>
        <option value="twoOctaves">Two Octaves (C-B-C)</option>
        <option value="beginner">Beginner (C-A)</option>
      </select>
    </div>

    <div class="chip" title="Loop points (4-bar chunks)">
      <label for="loopStart">Loop</label>
      <select id="loopStart" aria-label="Loop start"></select>
      <span aria-hidden="true">to</span>
      <select id="loopEnd" aria-label="Loop end"></select>
    </div>

    <button id="playBtn" onclick="playAll()">Play</button>
    <button id="stopBtn" onclick="stopPlayback()" disabled>Stop</button>
    <button onclick="clearAll()">Clear</button>
  </div>

  <div class="section">
    <h2>Melody</h2>

    <div class="pager">
      <button id="prevBtn" onclick="prevPage()">Prev</button>
      <div id="pagePill" class="pill">Bars 1-4 (Page 1/4)</div>
      <button id="nextBtn" onclick="nextPage()">Next</button>
    </div>

    <div class="rollWrap">
      <div class="frame" aria-label="Note names">
        <div class="labelHeaderSpacer" aria-hidden="true"></div>
        <div id="noteLabels" class="noteLabels"></div>
      </div>

      <div class="frame" aria-label="Piano roll">
        <canvas id="barHeader" class="headerCanvas" height="32" aria-label="Bar numbers"></canvas>
        <canvas id="pianoRoll" class="gridCanvas" height="280" aria-label="Melody grid"></canvas>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Drum Machine</h2>

    <div class="rollWrap">
      <div class="frame" aria-label="Drum names">
        <div class="labelHeaderSpacer" aria-hidden="true"></div>
        <div id="drumLabels" class="noteLabels"></div>
      </div>

      <div class="frame" aria-label="Drum grid">
        <canvas id="drumHeader" class="headerCanvas" height="32" aria-label="Drum bar numbers"></canvas>
        <canvas id="drumGrid" class="gridCanvas" height="120" aria-label="Drum grid"></canvas>
      </div>
    </div>
  </div>

  <script>
    // ===== Audio =====
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Master output so Stop can silence immediately
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;

    // Separate busses to avoid kick ↔ melody masking
    const melodyBus = audioCtx.createGain();
    const drumBus = audioCtx.createGain();

    // Gentle default balance (kid‑safe)
    melodyBus.gain.value = 0.9;
    drumBus.gain.value = 0.8;

    // EQ separation
    const melodyHP = audioCtx.createBiquadFilter();
    melodyHP.type = 'highpass';
    melodyHP.frequency.value = 120; // keep melody out of kick range

    const drumLP = audioCtx.createBiquadFilter();
    drumLP.type = 'lowpass';
    drumLP.frequency.value = 3000;

    // Sidechain-style ducking: kick briefly ducks melody
    const duckGain = audioCtx.createGain();
    duckGain.gain.value = 1;

    melodyBus.connect(melodyHP);
    melodyHP.connect(duckGain);
    duckGain.connect(masterGain);

    drumBus.connect(drumLP);
    drumLP.connect(masterGain);

    masterGain.connect(audioCtx.destination);

    // Track scheduled/playing nodes
    let activeAudioNodes = [];

    function registerNode(node) {
      activeAudioNodes.push(node);
      if (node && typeof node.addEventListener === 'function') {
        node.addEventListener('ended', () => {
          activeAudioNodes = activeAudioNodes.filter(n => n !== node);
        });
      }
      return node;
    }

    function stopAllAudio() {
      const now = audioCtx.currentTime;
      for (const node of activeAudioNodes) {
        try { node.stop(now); } catch (e) {}
        try { node.disconnect(); } catch (e) {}
      }
      activeAudioNodes = [];

      // Safety mute to kill any tail
      masterGain.gain.setValueAtTime(0, now);
      masterGain.gain.setValueAtTime(1, now + 0.02);
    }

    // ===== Pitches & Colors =====
    // Boomwhacker colors (custom mapping requested)
    const noteColors = {
      C: '#ff0000',
      D: '#ff7f00',
      E: '#ffff00',
      F: '#8ed265',
      G: '#008a8c',
      A: '#544ea8',
      B: '#df4082'
    };

    function colorForNote(note) {
      if (!note || note === 'REST') return '#4f7cff';
      const letter = note[0];
      return noteColors[letter] || '#4f7cff';
    }

    const frequencies = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.0, B5: 987.77
    };

    // ===== Timing / Grid =====
    // Each column is a 1/16 note.
    const stepsPerBar = 16;
    const beatSteps = 4; // 4 sixteenths per beat

    const melodyBarsTotal = 16;
    const pageBars = 4;
    const melodyPages = melodyBarsTotal / pageBars; // 4

    const drumBars = 4;

    const melodyColsTotal = melodyBarsTotal * stepsPerBar; // 256
    const pageSteps = pageBars * stepsPerBar;             // 64
    const drumCols = drumBars * stepsPerBar;              // 64

    const stepPx = 20;

    // ===== UI =====
    const tempoSlider = document.getElementById('tempo');
    const tempoValue = document.getElementById('tempoValue');
    const rangeSelect = document.getElementById('range');

    const loopStartSelect = document.getElementById('loopStart');
    const loopEndSelect = document.getElementById('loopEnd');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pagePill = document.getElementById('pagePill');

    tempoSlider.addEventListener('input', () => {
      tempoValue.textContent = tempoSlider.value;
    });

    function getStepDurationSeconds() {
      const bpm = Number(tempoSlider.value);
      return (60 / bpm) / 4; // sixteenth
    }

    // ===== Canvases =====
    const noteLabelsEl = document.getElementById('noteLabels');
    const barCanvas = document.getElementById('barHeader');
    const barCtx = barCanvas.getContext('2d');
    const melodyCanvas = document.getElementById('pianoRoll');
    const melodyCtx = melodyCanvas.getContext('2d');

    const drumLabelsEl = document.getElementById('drumLabels');
    const drumHeaderCanvas = document.getElementById('drumHeader');
    const drumHeaderCtx = drumHeaderCanvas.getContext('2d');
    const drumCanvas = document.getElementById('drumGrid');
    const drumCtx = drumCanvas.getContext('2d');

    // Fixed widths: show exactly 4 bars for melody and drums.
    const pageWidth = pageSteps * stepPx;
    barCanvas.width = pageWidth;
    melodyCanvas.width = pageWidth;
    drumHeaderCanvas.width = pageWidth;
    drumCanvas.width = pageWidth;

    // ===== Range modes (melody) =====
    const rangeModes = {
      oneOctave: ['B4','A4','G4','F4','E4','D4','C4'],
      twoOctaves: ['B5','A5','G5','F5','E5','D5','C5','B4','A4','G4','F4','E4','D4','C4'],
      beginner: ['A4','G4','F4','E4','D4','C4']
    };

    // ===== State =====
    let isPlaying = false;
    let playStartAudio = 0;
    let animationId = null;

    let pageIndex = 0; // 0..3

    // Loop points (4-bar pages)
    let loopStartPage = 0;
    let loopEndPage = melodyPages - 1;

    // Melody grid stores all 16 bars
    let notes = rangeModes.oneOctave.slice();
    let melodyRows = notes.length;

    const rowH = 40;
    melodyCanvas.height = rowH * melodyRows;

    let melodyCellW = melodyCanvas.width / pageSteps;
    let melodyCellH = melodyCanvas.height / melodyRows;

    let melodyData = Array.from({ length: melodyRows }, () => Array(melodyColsTotal).fill(false));

    // Drums (top -> bottom): hi-hat, snare, kick
    const drums = ['Hi-hat', 'Snare', 'Kick'];
    const drumRows = drums.length;
    drumCanvas.height = rowH * drumRows;

    let drumCellW = drumCanvas.width / drumCols;
    let drumCellH = drumCanvas.height / drumRows;

    let drumData = Array.from({ length: drumRows }, () => Array(drumCols).fill(false));

    // ===== Labels =====
    function renderVerticalLabels(el, labels, canvasHeight, cellH) {
      el.innerHTML = '';
      el.style.height = `${canvasHeight}px`;
      for (let i = 0; i < labels.length; i++) {
        const div = document.createElement('div');
        div.className = 'noteLabel';
        div.style.height = `${cellH}px`;
        div.style.flex = `0 0 ${cellH}px`;
        div.textContent = labels[i];

        if (el === noteLabelsEl) {
          div.style.color = colorForNote(labels[i]);
        }

        el.appendChild(div);
      }
    }

    function renderMelodyLabels() {
      renderVerticalLabels(noteLabelsEl, notes, melodyCanvas.height, melodyCellH);
    }

    function renderDrumLabels() {
      renderVerticalLabels(drumLabelsEl, drums, drumCanvas.height, drumCellH);
    }

    // ===== Paging / loop helpers =====
    function pageStartStep() {
      return pageIndex * pageSteps;
    }

    function loopStartStep() {
      return loopStartPage * pageSteps;
    }

    function loopEndStepExclusive() {
      return (loopEndPage + 1) * pageSteps;
    }

    function makePageLabel(p) {
      const startBar = p * pageBars + 1;
      const endBar = startBar + pageBars - 1;
      return `Bars ${startBar}-${endBar}`;
    }

    function fillLoopSelectsIfNeeded() {
      const fillSelect = (sel) => {
        sel.innerHTML = '';
        for (let p = 0; p < melodyPages; p++) {
          const opt = document.createElement('option');
          opt.value = String(p);
          opt.textContent = makePageLabel(p);
          sel.appendChild(opt);
        }
      };

      if (!loopStartSelect.options.length) fillSelect(loopStartSelect);
      if (!loopEndSelect.options.length) fillSelect(loopEndSelect);
    }

    function updateLoopUI() {
      fillLoopSelectsIfNeeded();
      loopStartSelect.value = String(loopStartPage);
      loopEndSelect.value = String(loopEndPage);
      loopStartSelect.disabled = isPlaying;
      loopEndSelect.disabled = isPlaying;
    }

    function setLoopPages(startP, endP) {
      let s = Math.max(0, Math.min(melodyPages - 1, startP));
      let e = Math.max(0, Math.min(melodyPages - 1, endP));
      if (s > e) e = s;
      loopStartPage = s;
      loopEndPage = e;
      updateLoopUI();
    }

    loopStartSelect.addEventListener('change', () => {
      setLoopPages(Number(loopStartSelect.value), loopEndPage);
    });

    loopEndSelect.addEventListener('change', () => {
      setLoopPages(loopStartPage, Number(loopEndSelect.value));
    });

    function updatePagerUI() {
      const startBar = pageIndex * pageBars + 1;
      const endBar = startBar + pageBars - 1;
      pagePill.textContent = `Bars ${startBar}-${endBar} (Page ${pageIndex + 1}/${melodyPages})`;
      prevBtn.disabled = (pageIndex === 0) || isPlaying;
      nextBtn.disabled = (pageIndex === melodyPages - 1) || isPlaying;
      updateLoopUI();
    }

    function goToPage(idx) {
      pageIndex = Math.max(0, Math.min(melodyPages - 1, idx));
      updatePagerUI();
      drawAll();
    }

    function nextPage() { goToPage(pageIndex + 1); }
    function prevPage() { goToPage(pageIndex - 1); }

    // ===== Bar headers =====
    function drawBarNumbersForPage() {
      barCtx.clearRect(0, 0, barCanvas.width, barCanvas.height);
      barCtx.fillStyle = '#fff';
      barCtx.fillRect(0, 0, barCanvas.width, barCanvas.height);

      const startBarZero = pageIndex * pageBars;

      for (let b = 0; b < pageBars; b++) {
        const globalBar = startBarZero + b;
        const localStep = b * stepsPerBar;
        const x = localStep * melodyCellW;

        // Bar start line
        barCtx.strokeStyle = '#9fb5ff';
        barCtx.lineWidth = 2;
        barCtx.beginPath();
        barCtx.moveTo(x, 0);
        barCtx.lineTo(x, barCanvas.height);
        barCtx.stroke();

        // Big bar number
        barCtx.fillStyle = '#111';
        barCtx.textAlign = 'left';
        barCtx.textBaseline = 'middle';
        barCtx.font = 'bold 13px Arial';
        barCtx.fillText(String(globalBar + 1), x + 6, barCanvas.height / 2);

        // Beat labels: 1.2, 1.3, 1.4 (light + smaller)
        barCtx.fillStyle = '#8a8a8a';
        barCtx.font = '11px Arial';
        for (let beat = 2; beat <= 4; beat++) {
          const beatX = (localStep + (beat - 1) * beatSteps) * melodyCellW;
          barCtx.fillText(`${globalBar + 1}.${beat}`, beatX + 6, barCanvas.height / 2);
        }
      }

      // Right boundary
      barCtx.strokeStyle = '#e6e6e6';
      barCtx.lineWidth = 1;
      barCtx.beginPath();
      barCtx.moveTo(pageSteps * melodyCellW, 0);
      barCtx.lineTo(pageSteps * melodyCellW, barCanvas.height);
      barCtx.stroke();

      barCtx.lineWidth = 1;
    }

    function drawDrumBarNumbers() {
      drumHeaderCtx.clearRect(0, 0, drumHeaderCanvas.width, drumHeaderCanvas.height);
      drumHeaderCtx.fillStyle = '#fff';
      drumHeaderCtx.fillRect(0, 0, drumHeaderCanvas.width, drumHeaderCanvas.height);

      for (let bar = 0; bar < drumBars; bar++) {
        const localStep = bar * stepsPerBar;
        const x = localStep * drumCellW;

        // Bar start line
        drumHeaderCtx.strokeStyle = '#9fb5ff';
        drumHeaderCtx.lineWidth = 2;
        drumHeaderCtx.beginPath();
        drumHeaderCtx.moveTo(x, 0);
        drumHeaderCtx.lineTo(x, drumHeaderCanvas.height);
        drumHeaderCtx.stroke();

        // Big bar number
        drumHeaderCtx.fillStyle = '#111';
        drumHeaderCtx.textAlign = 'left';
        drumHeaderCtx.textBaseline = 'middle';
        drumHeaderCtx.font = 'bold 13px Arial';
        drumHeaderCtx.fillText(String(bar + 1), x + 6, drumHeaderCanvas.height / 2);

        // Beat labels (light)
        drumHeaderCtx.fillStyle = '#8a8a8a';
        drumHeaderCtx.font = '11px Arial';
        for (let beat = 2; beat <= 4; beat++) {
          const beatX = (localStep + (beat - 1) * beatSteps) * drumCellW;
          drumHeaderCtx.fillText(`${bar + 1}.${beat}`, beatX + 6, drumHeaderCanvas.height / 2);
        }
      }

      // Right boundary
      drumHeaderCtx.strokeStyle = '#e6e6e6';
      drumHeaderCtx.lineWidth = 1;
      drumHeaderCtx.beginPath();
      drumHeaderCtx.moveTo(drumCols * drumCellW, 0);
      drumHeaderCtx.lineTo(drumCols * drumCellW, drumHeaderCanvas.height);
      drumHeaderCtx.stroke();

      drumHeaderCtx.lineWidth = 1;
    }

    // ===== Audio: melody =====
    function playTone(freq, startTime, duration) {
      // Plays a note with a short attack and a gentle release.
      // Duration is the *musical* length; we add a tiny tail for safety.
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.value = freq;

      const attack = 0.01;
      // Longer DECAY instead of sustain: sound fades gradually until next note
      const d = Math.max(0.001, duration);

      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.8, startTime + attack);
      // long decay over the whole note length
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + d);

      osc.connect(gain);
      gain.connect(melodyBus);

      osc.start(startTime);
      // tiny tail so the release finishes cleanly
      osc.stop(startTime + d + 0.02);

      registerNode(osc);
      return osc;
    }

    function previewMelody(note) {
      const freq = frequencies[note];
      if (typeof freq !== 'number') return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      playTone(freq, audioCtx.currentTime, 0.18);
    }

    // ===== Audio: drums =====
    function noiseBuffer(durationSec = 0.2) {
      const sampleRate = audioCtx.sampleRate;
      const length = Math.max(1, Math.floor(sampleRate * durationSec));
      const buffer = audioCtx.createBuffer(1, length, sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function playKick(time) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, time);
      osc.frequency.exponentialRampToValueAtTime(50, time + 0.12);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(1.0, time + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.25);

      osc.connect(gain);
      gain.connect(drumBus);

      // Duck melody very slightly when kick hits
      duckGain.gain.cancelScheduledValues(time);
      duckGain.gain.setValueAtTime(1, time);
      duckGain.gain.linearRampToValueAtTime(0.7, time + 0.01);
      duckGain.gain.linearRampToValueAtTime(1, time + 0.12);

      osc.start(time);
      osc.stop(time + 0.3);

      registerNode(osc);
      return osc;
    }

    function playSnare(time) {
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer(0.18);

      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'highpass';
      noiseFilter.frequency.setValueAtTime(900, time);

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, time);
      noiseGain.gain.exponentialRampToValueAtTime(0.9, time + 0.005);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

      const osc = audioCtx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(200, time);

      const oscGain = audioCtx.createGain();
      oscGain.gain.setValueAtTime(0.0001, time);
      oscGain.gain.exponentialRampToValueAtTime(0.3, time + 0.005);
      oscGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(drumBus);

      osc.connect(oscGain);
      oscGain.connect(drumBus);

      noise.start(time);
      noise.stop(time + 0.2);
      osc.start(time);
      osc.stop(time + 0.15);

      registerNode(noise);
      registerNode(osc);
      return { noise, osc };
    }

    function playHiHat(time) {
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer(0.08);

      const hp = audioCtx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.setValueAtTime(5000, time);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(0.6, time + 0.002);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);

      noise.connect(hp);
      hp.connect(gain);
      gain.connect(melodyBus);

      noise.start(time);
      noise.stop(time + 0.09);

      registerNode(noise);
      return noise;
    }

    function previewDrum(rowIndex) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const name = drums[rowIndex];
      if (name === 'Kick') playKick(t);
      if (name === 'Snare') playSnare(t);
      if (name === 'Hi-hat') playHiHat(t);
    }

    // ===== Drawing =====
    function hexToRgba(hex, alpha) {
      const h = String(hex || '').replace('#', '');
      if (h.length !== 6) return `rgba(0,0,0,${alpha})`;
      const r = parseInt(h.slice(0, 2), 16);
      const g = parseInt(h.slice(2, 4), 16);
      const b = parseInt(h.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function rootColorHexForGlobalBar(globalBarIndex) {
      const barStart = globalBarIndex * stepsPerBar;
      const barEnd = Math.min(barStart + stepsPerBar, melodyColsTotal);

      // "Root" = first note that happens in the bar (earliest in time)
      for (let c = barStart; c < barEnd; c++) {
        for (let r = 0; r < melodyRows; r++) {
          if (melodyData[r][c]) {
            const note = notes[r];
            const letter = note && note[0];
            return noteColors[letter] || null;
          }
        }
      }
      return null;
    }

    function noteLetterAtGlobalStep(globalStep) {
      // Return the note letter (C..B) for the first active note at this time step, else null
      if (globalStep < 0 || globalStep >= melodyColsTotal) return null;
      for (let r = 0; r < melodyRows; r++) {
        if (melodyData[r][globalStep]) {
          const note = notes[r];
          return (note && note[0]) || null;
        }
      }
      return null;
    }

    function paintNoteStepTints(ctx, cellW, height) {
      // If a step has a note, tint that entire column using that note's Boomwhacker color.
      // This makes the background "change with every new note".
      const start = pageStartStep();
      for (let local = 0; local < pageSteps; local++) {
        const global = start + local;
        const letter = noteLetterAtGlobalStep(global);
        if (!letter) continue;
        const hex = noteColors[letter];
        if (!hex) continue;
        ctx.fillStyle = hexToRgba(hex, 0.10);
        ctx.fillRect(local * cellW, 0, cellW, height);
      }
    }

    function paintBeatBands(ctx, totalSteps, cellW, height) {
      for (let c = 0; c < totalSteps; c += beatSteps) {
        const bandIndex = Math.floor(c / beatSteps);
        ctx.fillStyle = (bandIndex % 2 === 0) ? '#ffffff' : '#f2f2f2';
        ctx.fillRect(c * cellW, 0, beatSteps * cellW, height);
      }
    }

    function drawMelodyGrid(playheadGlobalStep = null) {
      melodyCtx.clearRect(0, 0, melodyCanvas.width, melodyCanvas.height);
      paintBeatBands(melodyCtx, pageSteps, melodyCellW, melodyCanvas.height);
      paintNoteStepTints(melodyCtx, melodyCellW, melodyCanvas.height);

      const start = pageStartStep();

      for (let r = 0; r < melodyRows; r++) {
        for (let local = 0; local < pageSteps; local++) {
          const global = start + local;

          const isBarStart = (local % stepsPerBar === 0);
          melodyCtx.strokeStyle = isBarStart ? '#9fb5ff' : '#ccc';
          melodyCtx.lineWidth = isBarStart ? 2 : 1;
          melodyCtx.strokeRect(local * melodyCellW, r * melodyCellH, melodyCellW, melodyCellH);

          if (melodyData[r][global]) {
            const note = notes[r];
            melodyCtx.fillStyle = colorForNote(note);
            melodyCtx.fillRect(
              local * melodyCellW + 2,
              r * melodyCellH + 2,
              melodyCellW - 4,
              melodyCellH - 4
            );
          }
        }
      }

      if (playheadGlobalStep !== null && Number.isFinite(playheadGlobalStep)) {
        const s = pageStartStep();
        const e = s + pageSteps;
        if (playheadGlobalStep >= s && playheadGlobalStep <= e) {
          const local = playheadGlobalStep - s;
          const x = Math.max(0, Math.min(melodyCanvas.width, local * melodyCellW));
          melodyCtx.beginPath();
          melodyCtx.moveTo(x, 0);
          melodyCtx.lineTo(x, melodyCanvas.height);
          melodyCtx.strokeStyle = '#ff3b30';
          melodyCtx.lineWidth = 3;
          melodyCtx.stroke();
        }
      }

      melodyCtx.lineWidth = 1;
    }

    function drawDrumGrid(playheadDrumStep = null) {
      drumCtx.clearRect(0, 0, drumCanvas.width, drumCanvas.height);
      paintBeatBands(drumCtx, drumCols, drumCellW, drumCanvas.height);

      for (let r = 0; r < drumRows; r++) {
        for (let c = 0; c < drumCols; c++) {
          const isBarStart = (c % stepsPerBar === 0);
          drumCtx.strokeStyle = isBarStart ? '#9fb5ff' : '#ccc';
          drumCtx.lineWidth = isBarStart ? 2 : 1;
          drumCtx.strokeRect(c * drumCellW, r * drumCellH, drumCellW, drumCellH);

          if (drumData[r][c]) {
            drumCtx.fillStyle = '#4f7cff';
            drumCtx.fillRect(
              c * drumCellW + 2,
              r * drumCellH + 2,
              drumCellW - 4,
              drumCellH - 4
            );
          }
        }
      }

      if (playheadDrumStep !== null && Number.isFinite(playheadDrumStep)) {
        const x = Math.max(0, Math.min(drumCanvas.width, playheadDrumStep * drumCellW));
        drumCtx.beginPath();
        drumCtx.moveTo(x, 0);
        drumCtx.lineTo(x, drumCanvas.height);
        drumCtx.strokeStyle = '#ff3b30';
        drumCtx.lineWidth = 3;
        drumCtx.stroke();
      }

      drumCtx.lineWidth = 1;
    }

    // ===== Melody computation =====
    function computeMelodySteps() {
      const out = [];
      for (let c = 0; c < melodyColsTotal; c++) {
        let found = false;
        for (let r = 0; r < melodyRows; r++) {
          if (melodyData[r][c]) {
            out.push(notes[r]);
            found = true;
            break;
          }
        }
        if (!found) out.push('REST');
      }
      return out;
    }

    // ===== Playback =====
    function playAll() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      stopAllAudio();

      // Validate loop points
      setLoopPages(loopStartPage, loopEndPage);

      const melodySteps = computeMelodySteps();
      const stepDur = getStepDurationSeconds();

      isPlaying = true;
      playBtn.disabled = true;
      stopBtn.disabled = false;
      updatePagerUI();

      playStartAudio = audioCtx.currentTime;
      scheduleOneLoop(melodySteps, stepDur, playStartAudio);
      animatePlayhead(stepDur, melodySteps);
    }

    function scheduleOneLoop(melodySteps, stepDur, startAudioTime) {
      // Melody is LEGATO: each note sustains until the next note starts.
      // Drums still trigger on every 16th.
      const startStep = loopStartStep();
      const endStep = loopEndStepExclusive();

      // --- Melody legato scheduling ---
      for (let i = startStep; i < endStep; i++) {
        const m = melodySteps[i];
        if (m === 'REST') continue;

        // Find next note onset (not REST)
        let j = i + 1;
        while (j < endStep && melodySteps[j] === 'REST') j++;

        const durSteps = (j < endStep) ? (j - i) : (endStep - i);
        const durSec = durSteps * stepDur;

        const freq = frequencies[m];
        if (typeof freq === 'number') {
          const t = startAudioTime + (i - startStep) * stepDur;
          // Slightly shorten to avoid overlap clicks at exact next start
          playTone(freq, t, Math.max(0.02, durSec * 0.995));
        }

        // Skip ahead to the step before next note onset (rests in between are covered by sustain)
        i = j - 1;
      }

      // --- Drums step scheduling ---
      let t = startAudioTime;
      for (let i = startStep; i < endStep; i++) {
        const di = (i - startStep) % drumCols;
        if (drumData[0][di]) playHiHat(t);
        if (drumData[1][di]) playSnare(t);
        if (drumData[2][di]) playKick(t);
        t += stepDur;
      }
    }

    function stopPlayback() {
      stopAllAudio();

      isPlaying = false;
      playBtn.disabled = false;
      stopBtn.disabled = true;

      if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
      }

      updatePagerUI();
      drawAll();
    }

    function animatePlayhead(stepDur, melodySteps) {
      const loopSteps = loopEndStepExclusive() - loopStartStep();
      const loopDuration = loopSteps * stepDur;

      const tick = () => {
        if (!isPlaying) return;

        const elapsed = audioCtx.currentTime - playStartAudio;

        // Reschedule loop
        if (elapsed >= loopDuration) {
          playStartAudio += loopDuration;
          scheduleOneLoop(melodySteps, stepDur, playStartAudio);
        }

        const loopElapsed = audioCtx.currentTime - playStartAudio;
        const headGlobal = loopStartStep() + (loopElapsed / stepDur);

        // Auto-page to keep playhead visible
        const desiredPage = Math.max(0, Math.min(melodyPages - 1, Math.floor(headGlobal / pageSteps)));
        if (desiredPage !== pageIndex) {
          pageIndex = desiredPage;
          updatePagerUI();
          drawBarNumbersForPage();
        }

        drawMelodyGrid(headGlobal);
        drawDrumGrid((headGlobal - loopStartStep()) % drumCols);

        animationId = requestAnimationFrame(tick);
      };

      animationId = requestAnimationFrame(tick);
    }

    // ===== Clear =====
    function clearAll() {
      stopPlayback();
      for (let r = 0; r < melodyRows; r++) melodyData[r].fill(false);
      for (let r = 0; r < drumRows; r++) drumData[r].fill(false);
      drawAll();
    }

    // ===== Interaction =====
    melodyCanvas.addEventListener('click', (e) => {
      if (isPlaying) return;

      const rect = melodyCanvas.getBoundingClientRect();
      const localCol = Math.floor((e.clientX - rect.left) / melodyCellW);
      const row = Math.floor((e.clientY - rect.top) / melodyCellH);

      if (localCol < 0 || localCol >= pageSteps || row < 0 || row >= melodyRows) return;

      const globalCol = pageStartStep() + localCol;
      melodyData[row][globalCol] = !melodyData[row][globalCol];

      if (melodyData[row][globalCol]) {
        // monophonic per column
        for (let rr = 0; rr < melodyRows; rr++) if (rr !== row) melodyData[rr][globalCol] = false;
        previewMelody(notes[row]);
      }

      drawMelodyGrid();
    });

    drumCanvas.addEventListener('click', (e) => {
      if (isPlaying) return;

      const rect = drumCanvas.getBoundingClientRect();
      const col = Math.floor((e.clientX - rect.left) / drumCellW);
      const row = Math.floor((e.clientY - rect.top) / drumCellH);

      if (col < 0 || col >= drumCols || row < 0 || row >= drumRows) return;

      drumData[row][col] = !drumData[row][col];
      if (drumData[row][col]) previewDrum(row);
      drawDrumGrid();
    });

    // ===== Range update =====
    rangeSelect.addEventListener('change', () => {
      setRange(rangeSelect.value);
    });

    function setRange(mode) {
      const newNotes = (rangeModes[mode] || rangeModes.oneOctave).slice();
      notes = newNotes;
      melodyRows = notes.length;

      melodyCanvas.height = rowH * melodyRows;
      melodyCellW = melodyCanvas.width / pageSteps;
      melodyCellH = melodyCanvas.height / melodyRows;

      // reset melody content when changing range (simplest for kids)
      melodyData = Array.from({ length: melodyRows }, () => Array(melodyColsTotal).fill(false));

      renderMelodyLabels();
      drawBarNumbersForPage();
      drawMelodyGrid();
    }

    // ===== Draw all =====
    function drawAll() {
      renderMelodyLabels();
      renderDrumLabels();
      drawBarNumbersForPage();
      drawDrumBarNumbers();
      drawMelodyGrid();
      drawDrumGrid();
    }

    // ===== Init =====
    setLoopPages(0, melodyPages - 1);
    updatePagerUI();
    drawAll();

    // ===== Tests / sanity checks =====
    (function runSanityChecks() {
      console.assert(melodyColsTotal === 256, 'melodyColsTotal should be 256 (16 bars)');
      console.assert(pageSteps === 64, 'pageSteps should be 64 (4 bars)');
      console.assert(drumCols === 64, 'drumCols should be 64 (4 bars)');
      console.assert(melodyPages === 4, 'melodyPages should be 4 pages');
      console.assert(loopStartStep() === 0, 'default loopStartStep should be 0');
      console.assert(loopEndStepExclusive() === 256, 'default loopEndStepExclusive should be 256');

      // Loop clamping
      setLoopPages(2, 1);
      console.assert(loopStartPage === 2 && loopEndPage === 2, 'end should clamp up to start when start > end');

      setLoopPages(-5, 99);
      console.assert(loopStartPage === 0 && loopEndPage === 3, 'loop pages should clamp to valid range');

      // Color sanity
      console.assert(colorForNote('F4') === noteColors.F, 'F should map to custom F color');
      console.assert(colorForNote('G4') === noteColors.G, 'G should map to custom G color');
      console.assert(colorForNote('A4') === noteColors.A, 'A should map to custom A color');
      console.assert(colorForNote('B4') === noteColors.B, 'B should map to custom B color');
      console.assert(colorForNote('REST') === '#4f7cff', 'REST should use default fill color');

      // Legato behavior sanity: if a note is followed by 3 rests, duration should be 4 steps
      (function () {
        const arr = ['C4','REST','REST','REST','D4'];
        const stepDur = 0.1;
        let i = 0;
        let j = i + 1;
        while (j < arr.length && arr[j] === 'REST') j++;
        const durSteps = (j < arr.length) ? (j - i) : (arr.length - i);
        console.assert(durSteps === 4, 'Legato duration should extend through rests until next note');
      })();

      // Hex -> rgba helper
      console.assert(hexToRgba('#ff0000', 0.1) === 'rgba(255,0,0,0.1)', 'hexToRgba should convert correctly');

      // Note-at-step helper
      (function () {
        // Ensure empty returns null
        console.assert(noteLetterAtGlobalStep(0) === null, 'noteLetterAtGlobalStep should be null when empty');
        // Place a test note and verify
        melodyData[melodyRows - 1][0] = true; // typically C4 at bottom in oneOctave
        console.assert(['C','D','E','F','G','A','B'].includes(noteLetterAtGlobalStep(0)), 'noteLetterAtGlobalStep should return a letter when note exists');
        melodyData[melodyRows - 1][0] = false;
      })();

      // Restore default
      setLoopPages(0, 3);
    })();
  </script>
</body>
</html>
