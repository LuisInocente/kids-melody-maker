<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Melody Maker</title>
  <style>
    :root{
      --bg:#f2f7ff;
      --card:#ffffff;
      --border:#d9e2ff;
      --accent:#4f7cff;

      --grid:#cfcfcf;
      --beatA:#ffffff;
      --beatB:#f2f2f2;

      --barLine:#9fb5ff;
    }

    body{
      font-family:Arial,sans-serif;
      background:var(--bg);
      text-align:center;
      padding:20px;
      margin:0;
      user-select:none;
    }

    h1{ color:#333; margin:0 0 10px; }
    h2{ color:#333; margin:22px 0 10px; }

    .controls{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:14px;
      flex-wrap:wrap;
      margin:12px 0 16px;
    }

    .chip{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 12px;
      display:inline-flex;
      align-items:center;
      gap:10px;
    }

    .chip label{
      font-size:14px;
      color:#333;
      display:inline-flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
    }

    input[type="range"]{ width:220px; }

    select{
      padding:8px 10px;
      border-radius:10px;
      border:1px solid #c9d6ff;
      background:#fff;
      font-size:14px;
    }

    button{
      padding:12px 18px;
      font-size:16px;
      border-radius:10px;
      border:none;
      cursor:pointer;
      background:var(--accent);
      color:#fff;
    }
    button:hover{ background:#365edc; }
    button:disabled{ opacity:.6; cursor:not-allowed; }

    .section{ margin-top:18px; }

    .pill{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 12px;
      font-size:14px;
      color:#222;
      min-width:220px;
      text-align:center;
      display:inline-block;
    }

    .rollWrap{
      display:flex;
      justify-content:center;
      align-items:stretch;
      gap:10px;
      margin:0 auto;
      max-width:95vw;
    }

    .frame{
      background:var(--card);
      border:2px solid #ccc;
      border-radius:10px;
      box-sizing:border-box;
    }

    .noteLabels{
      width:88px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      box-sizing:border-box;
      background:#e7e7e7;
    }

    /* subtle outline ONLY for left-side labels */
    .noteLabel{
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      border-bottom:1px solid #d2d2d2;
      background:#ededed;
      text-shadow:
        0 1px 0 rgba(0,0,0,0.22),
        1px 0 0 rgba(0,0,0,0.12),
        -1px 0 0 rgba(0,0,0,0.12);
    }

    .labelHeaderSpacer{
      height:32px;
      border-bottom:1px solid #eee;
      border-radius:10px 10px 0 0;
      box-sizing:border-box;
      background:#fff;
    }

    .scrollX{
      overflow-x:auto;
      overflow-y:hidden;
      width:min(1280px, 95vw);
      border-radius:8px;
    }

    canvas{
      display:block;
      background:#fff;
      border-radius:8px;
    }

    .headerCanvas{
      border-bottom:1px solid #eee;
      border-radius:8px 8px 0 0;
    }

    .gridCanvas{
      border-radius:0 0 8px 8px;
    }
  </style>
</head>

<body>
  <h1>Kids Melody Maker</h1>

  <div class="controls">
    <div class="chip" title="Advanced modules">
      <label><input type="checkbox" id="toggleBass" /> Bass</label>
      <label><input type="checkbox" id="toggleChords" /> Chords</label>
    </div>

    <div class="chip" title="Tempo">
      <label for="tempo">Tempo</label>
      <input id="tempo" type="range" min="50" max="160" value="120" />
      <span id="tempoValue">120</span>
    </div>

    <div class="chip" title="Note range">
      <label for="range">Melody Range</label>
      <select id="range">
        <option value="oneOctave" selected>One Octave (C-B)</option>
        <option value="twoOctaves">Two Octaves (C-B-C)</option>
        <option value="beginner">Beginner (C-A)</option>
      </select>
    </div>

    <div class="chip" title="Melody bars selection (4-bar chunks)">
      <label for="loopStart">Bars</label>
      <select id="loopStart" aria-label="Bars start"></select>
      <span aria-hidden="true">to</span>
      <select id="loopEnd" aria-label="Bars end"></select>
    </div>

    <div class="chip" title="Drum loop length (playback)">
      <label for="drumLoop">Drum loop</label>
      <select id="drumLoop" aria-label="Drum loop length">
        <option value="1" selected>1 bar</option>
        <option value="2">2 bars</option>
        <option value="3">3 bars</option>
        <option value="4">4 bars</option>
      </select>
    </div>

    <button id="playBtn" onclick="playAll()">Play</button>
    <button id="stopBtn" onclick="stopPlayback()" disabled>Stop</button>
    <button id="clearBtn" onclick="clearAll()">Clear</button>
    <button id="saveBtn" onclick="saveProject()">Save</button>
    <button id="loadBtn" onclick="loadProject()">Load</button>
    <input id="fileInput" type="file" accept=".json,application/json" style="display:none" />
  </div>

  <div class="section" id="melodySection">
    <h2>Melody</h2>
    <div id="pagePill" class="pill">Bars 1–4</div>

    <div class="rollWrap" style="margin-top:10px;">
      <div class="frame" aria-label="Note names">
        <div class="labelHeaderSpacer" aria-hidden="true"></div>
        <div id="noteLabels" class="noteLabels"></div>
      </div>

      <div class="frame" aria-label="Piano roll">
        <div id="melodyScroll" class="scrollX" aria-label="Melody scroll">
          <canvas id="barHeader" class="headerCanvas" height="32" aria-label="Bar numbers"></canvas>
          <canvas id="pianoRoll" class="gridCanvas" height="280" aria-label="Melody grid"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="section" id="bassSection">
    <h2>Bass</h2>
    <div class="rollWrap">
      <div class="frame" aria-label="Bass note names">
        <div class="labelHeaderSpacer" aria-hidden="true"></div>
        <div id="bassLabels" class="noteLabels"></div>
      </div>

      <div class="frame" aria-label="Bass roll">
        <div id="bassScroll" class="scrollX" aria-label="Bass scroll">
          <canvas id="bassHeader" class="headerCanvas" height="32" aria-label="Bass bar numbers"></canvas>
          <canvas id="bassRoll" class="gridCanvas" height="200" aria-label="Bass grid"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="section" id="chordsSection">
    <h2>Chords</h2>
    <div class="rollWrap">
      <div class="frame" aria-label="Chord note names">
        <div class="labelHeaderSpacer" aria-hidden="true"></div>
        <div id="chordLabels" class="noteLabels"></div>
      </div>

      <div class="frame" aria-label="Chord grid">
        <div id="chordScroll" class="scrollX" aria-label="Chords scroll">
          <canvas id="chordHeader" class="headerCanvas" height="32" aria-label="Chord bar numbers"></canvas>
          <canvas id="chordGrid" class="gridCanvas" height="280" aria-label="Chord grid"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="section" id="drumsSection">
    <h2>Drum Machine</h2>

    <div class="rollWrap">
      <div class="frame" aria-label="Drum names">
        <div class="labelHeaderSpacer" aria-hidden="true"></div>
        <div id="drumLabels" class="noteLabels"></div>
      </div>

      <div class="frame" aria-label="Drum grid">
        <div id="drumScroll" class="scrollX" aria-label="Drums scroll">
          <canvas id="drumHeader" class="headerCanvas" height="32" aria-label="Drum bar numbers"></canvas>
          <canvas id="drumGrid" class="gridCanvas" height="120" aria-label="Drum grid"></canvas>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // =========================
  // Constants
  // =========================
  const stepsPerBar = 16;
  const beatSteps = 4;
  const stepPx = 20;
  const rowH = 40;

  const melodyBarsTotal = 16;
  const chunkBars = 4;
  const chunksTotal = melodyBarsTotal / chunkBars;
  const melodyColsTotal = melodyBarsTotal * stepsPerBar;

  // drums ALWAYS display 4 bars
  const drumColsStorage = 4 * stepsPerBar; // 64

  const noteColors = {
    C:'#ff0000',
    D:'#ff7f00',
    E:'#f2d200', // darker yellow
    F:'#8ed265',
    G:'#008a8c',
    A:'#544ea8',
    B:'#df4082'
  };

  const drumNames = ['Hi-hat','Snare','Kick'];
  const drumColors = { 'Hi-hat': noteColors.E, 'Snare': noteColors.D, 'Kick': noteColors.C };

  const frequencies = {
    C2:65.41, D2:73.42, E2:82.41, F2:87.31, G2:98.00, A2:110.00, B2:123.47,
    C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
    C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77
  };

  const rangeModes = {
    oneOctave: ['B4','A4','G4','F4','E4','D4','C4'],
    twoOctaves: ['B5','A5','G5','F5','E5','D5','C5','B4','A4','G4','F4','E4','D4','C4'],
    beginner: ['A4','G4','F4','E4','D4','C4']
  };

  const bassNotes = ['B3','A3','G3','F3','E3','D3','C3'];

  // =========================
  // Helpers
  // =========================
  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
  const cssVar = (name)=>getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  function colorForNote(note){
    if (!note || note === 'REST') return '#4f7cff';
    return noteColors[note[0]] || '#4f7cff';
  }
  function colorForDrum(name){ return drumColors[name] || '#4f7cff'; }

  function hexToRgb(hex){
    const h = String(hex || '').replace('#','');
    if (h.length !== 6) return {r:0,g:0,b:0};
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  }
  function bestTextColorOn(hex){
    const {r,g,b} = hexToRgb(hex);
    const lum = (0.2126*r + 0.7152*g + 0.0722*b) / 255;
    return lum > 0.62 ? '#111' : '#fff';
  }

  function labelForCell(name, isDrum){
    if (!name) return '';
    if (isDrum){
      if (name === 'Hi-hat') return 'HH';
      if (name === 'Snare') return 'S';
      if (name === 'Kick') return 'K';
      return name.slice(0,2).toUpperCase();
    }
    return name[0] || '';
  }

  function followPlayhead(scrollEl, xPx){
    if (!scrollEl) return;
    const max = scrollEl.scrollWidth - scrollEl.clientWidth;
    if (max <= 0) return;
    scrollEl.scrollLeft = clamp(xPx - scrollEl.clientWidth / 2, 0, max);
  }

  // grid letters: NO outline
  function drawGridText(ctx, text, x, y, fillColor){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px Arial';
    ctx.fillStyle = fillColor;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  // =========================
  // DOM
  // =========================
  const toggleBass = document.getElementById('toggleBass');
  const toggleChords = document.getElementById('toggleChords');
  const bassSection = document.getElementById('bassSection');
  const chordsSection = document.getElementById('chordsSection');

  const tempoSlider = document.getElementById('tempo');
  const tempoValue = document.getElementById('tempoValue');
  const rangeSelect = document.getElementById('range');
  const loopStartSelect = document.getElementById('loopStart');
  const loopEndSelect = document.getElementById('loopEnd');
  const drumLoopSelect = document.getElementById('drumLoop');

  const playBtn = document.getElementById('playBtn');
  const stopBtn = document.getElementById('stopBtn');
  const pagePill = document.getElementById('pagePill');

  const fileInput = document.getElementById('fileInput');

  const noteLabelsEl = document.getElementById('noteLabels');
  const bassLabelsEl = document.getElementById('bassLabels');
  const chordLabelsEl = document.getElementById('chordLabels');
  const drumLabelsEl = document.getElementById('drumLabels');

  const melodyScroll = document.getElementById('melodyScroll');
  const bassScroll = document.getElementById('bassScroll');
  const chordScroll = document.getElementById('chordScroll');
  const drumScroll = document.getElementById('drumScroll');

  const barCanvas = document.getElementById('barHeader');
  const melodyCanvas = document.getElementById('pianoRoll');
  const bassHeaderCanvas = document.getElementById('bassHeader');
  const bassCanvas = document.getElementById('bassRoll');
  const chordHeaderCanvas = document.getElementById('chordHeader');
  const chordCanvas = document.getElementById('chordGrid');
  const drumHeaderCanvas = document.getElementById('drumHeader');
  const drumCanvas = document.getElementById('drumGrid');

  const barCtx = barCanvas.getContext('2d');
  const melodyCtx = melodyCanvas.getContext('2d');
  const bassHeaderCtx = bassHeaderCanvas.getContext('2d');
  const bassCtx = bassCanvas.getContext('2d');
  const chordHeaderCtx = chordHeaderCanvas.getContext('2d');
  const chordCtx = chordCanvas.getContext('2d');
  const drumHeaderCtx = drumHeaderCanvas.getContext('2d');
  const drumCtx = drumCanvas.getContext('2d');

  // =========================
  // Audio
  // =========================
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;

  const melodyBus = audioCtx.createGain();
  const bassBus = audioCtx.createGain();
  const chordBus = audioCtx.createGain();
  const drumBus = audioCtx.createGain();

  melodyBus.gain.value = 0.9;
  bassBus.gain.value = 0.55;
  chordBus.gain.value = 0.55;
  drumBus.gain.value = 0.8;

  const musicBus = audioCtx.createGain();
  musicBus.gain.value = 1;

  const bassHP = audioCtx.createBiquadFilter();
  bassHP.type = 'highpass';
  bassHP.frequency.value = 55;

  const bassLP = audioCtx.createBiquadFilter();
  bassLP.type = 'lowpass';
  bassLP.frequency.value = 900;

  melodyBus.connect(musicBus);
  chordBus.connect(musicBus);
  bassBus.connect(bassHP);
  bassHP.connect(bassLP);
  bassLP.connect(musicBus);

  const musicHP = audioCtx.createBiquadFilter();
  musicHP.type = 'highpass';
  musicHP.frequency.value = 140;

  const drumLP = audioCtx.createBiquadFilter();
  drumLP.type = 'lowpass';
  drumLP.frequency.value = 3000;

  const duckGain = audioCtx.createGain();
  duckGain.gain.value = 1;

  musicBus.connect(musicHP);
  musicHP.connect(duckGain);
  duckGain.connect(masterGain);

  drumBus.connect(drumLP);
  drumLP.connect(masterGain);

  masterGain.connect(audioCtx.destination);

  let activeAudioNodes = [];
  const registerNode = (node)=>(activeAudioNodes.push(node), node);

  function stopAllAudio(){
    const now = audioCtx.currentTime;
    for (const node of activeAudioNodes){
      try { node.stop(now); } catch (_) {}
      try { node.disconnect(); } catch (_) {}
    }
    activeAudioNodes = [];
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
    masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.01);
    masterGain.gain.linearRampToValueAtTime(1.0, now + 0.03);
  }

  // =========================
  // State
  // =========================
  let isPlaying = false;
  let playStartAudio = 0;
  let animationId = null;

  let loopStartChunk = 0;
  let loopEndChunk = 0;

  let notes = rangeModes.oneOctave.slice();
  let melodyRows = notes.length;
  let chordNotes = notes;
  let chordRows = chordNotes.length;

  let melodyData = Array.from({length: melodyRows}, () => Array(melodyColsTotal).fill(false));
  let bassData   = Array.from({length: bassNotes.length}, () => Array(melodyColsTotal).fill(false));
  let chordData  = Array.from({length: chordRows}, () => Array(melodyColsTotal).fill(false));

  // drums stored for 4 bars always
  let drumData = Array.from({length: drumNames.length}, () => Array(drumColsStorage).fill(false));

  let selectedBars = 4;
  let selectedSteps = selectedBars * stepsPerBar;

  // drum loop affects playback, and header highlight
  let drumVisibleBars = 1;
  let drumVisibleSteps = drumVisibleBars * stepsPerBar;

  // =========================
  // Selection + Clipboard (traditional + drag move + alt-duplicate)
  // =========================
  const sel = { melody:new Set(), bass:new Set(), chords:new Set(), drums:new Set() };
  const lastCell = { melody:{r:0,c:0}, bass:{r:0,c:0}, chords:{r:0,c:0}, drums:{r:0,c:0} };
  let activeGrid = 'melody';
  let clipboard = null;

  function keyOf(r,c){ return `${r},${c}`; }
  function parseKey(k){ const [r,c] = k.split(',').map(Number); return {r,c}; }
  function clearSelection(grid){ sel[grid].clear(); }
  function setActiveGrid(grid){ activeGrid = grid; }

  function selectionBounds(grid){
    const s = sel[grid];
    if (!s || s.size === 0) return null;
    let minR=Infinity, minC=Infinity, maxR=-Infinity, maxC=-Infinity;
    for (const k of s){
      const {r,c} = parseKey(k);
      minR = Math.min(minR, r);
      minC = Math.min(minC, c);
      maxR = Math.max(maxR, r);
      maxC = Math.max(maxC, c);
    }
    return {minR,minC,maxR,maxC};
  }

  function isCellInSelection(gridName, r, c){
    return sel[gridName].has(keyOf(r,c));
  }

  function rowsForGrid(grid){
    return (grid === 'melody') ? melodyRows :
           (grid === 'bass') ? bassNotes.length :
           (grid === 'chords') ? chordRows :
           drumNames.length;
  }

  function colsForGrid(grid){
    return (grid === 'drums') ? drumColsStorage : selectedSteps;
  }

  // =========================
  // Computed
  // =========================
  function stepDurSec(){
    const bpm = Number(tempoSlider.value);
    return (60 / bpm) / 4;
  }

  function drumLoopBars(){
    const bars = Number(drumLoopSelect.value);
    return clamp(Number.isFinite(bars) ? bars : 1, 1, 4);
  }

  function loopStartStep(){
    return loopStartChunk * chunkBars * stepsPerBar;
  }

  function loopEndStepExclusive(){
    return (loopEndChunk + 1) * chunkBars * stepsPerBar;
  }

  function updateSelectionRange(){
    selectedBars = (loopEndChunk - loopStartChunk + 1) * chunkBars;
    selectedSteps = selectedBars * stepsPerBar;

    const startBar = loopStartChunk * chunkBars + 1;
    const endBar = (loopEndChunk + 1) * chunkBars;
    pagePill.textContent = `Bars ${startBar}–${endBar}`;
  }

  function applyCanvasSizes(){
    const w = selectedSteps * stepPx;

    barCanvas.width = w;
    melodyCanvas.width = w;

    bassHeaderCanvas.width = w;
    bassCanvas.width = w;

    chordHeaderCanvas.width = w;
    chordCanvas.width = w;

    // drums: ALWAYS 4 bars wide visually
    drumVisibleBars = drumLoopBars();
    drumVisibleSteps = drumVisibleBars * stepsPerBar;
    drumHeaderCanvas.width = drumColsStorage * stepPx;
    drumCanvas.width = drumColsStorage * stepPx;

    melodyCanvas.height = rowH * melodyRows;
    bassCanvas.height = rowH * bassNotes.length;
    chordCanvas.height = rowH * chordRows;
    drumCanvas.height = rowH * drumNames.length;
  }

  function setVisibleChunks(startC, endC){
    let s = clamp(startC, 0, chunksTotal - 1);
    let e = clamp(endC,   0, chunksTotal - 1);
    if (s > e) e = s;

    loopStartChunk = s;
    loopEndChunk = e;

    loopStartSelect.value = String(s);
    loopEndSelect.value = String(e);

    updateSelectionRange();
    applyCanvasSizes();

    melodyScroll.scrollLeft = 0;
    bassScroll.scrollLeft = 0;
    chordScroll.scrollLeft = 0;

    clearSelection('melody');
    clearSelection('bass');
    clearSelection('chords');
    clearSelection('drums');

    drawAll();
  }

  // =========================
  // Labels
  // =========================
  function renderVerticalLabels(el, labels, canvasHeight, mode){
    el.innerHTML = '';
    el.style.height = `${canvasHeight}px`;
    for (let i=0; i<labels.length; i++){
      const div = document.createElement('div');
      div.className = 'noteLabel';
      div.style.height = `${rowH}px`;
      div.style.flex = `0 0 ${rowH}px`;
      div.textContent = labels[i];
      if (mode === 'note') div.style.color = colorForNote(labels[i]);
      if (mode === 'drum') div.style.color = colorForDrum(labels[i]);
      el.appendChild(div);
    }
  }

  function renderAllLabels(){
    renderVerticalLabels(noteLabelsEl, notes, melodyCanvas.height, 'note');
    renderVerticalLabels(drumLabelsEl, drumNames, drumCanvas.height, 'drum');
    if (toggleBass.checked) renderVerticalLabels(bassLabelsEl, bassNotes, bassCanvas.height, 'note');
    if (toggleChords.checked) renderVerticalLabels(chordLabelsEl, chordNotes, chordCanvas.height, 'note');
  }

  // =========================
  // Headers
  // =========================
  function drawHeader(ctx, totalSteps, startBarNumber, barsCount, opts = {}){
    const { clear=true, fillBg=true } = opts;
    const w = totalSteps * stepPx;

    if (clear) ctx.clearRect(0,0,w,32);
    if (fillBg){
      ctx.fillStyle = '#fff';
      ctx.fillRect(0,0,w,32);
    }

    const barLine = cssVar('--barLine') || '#9fb5ff';

    for (let b=0; b<barsCount; b++){
      const barNo = startBarNumber + b;
      const localStep = b * stepsPerBar;
      const x = localStep * stepPx;

      ctx.strokeStyle = barLine;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,32);
      ctx.stroke();

      ctx.fillStyle = '#111';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 13px Arial';
      ctx.fillText(String(barNo), x+6, 16);

      ctx.fillStyle = '#8a8a8a';
      ctx.font = '11px Arial';
      for (let beat=2; beat<=4; beat++){
        const beatX = (localStep + (beat-1)*beatSteps) * stepPx;
        ctx.fillText(`${barNo}.${beat}`, beatX+6, 16);
      }
    }

    ctx.strokeStyle = '#e6e6e6';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(w,0);
    ctx.lineTo(w,32);
    ctx.stroke();
    ctx.lineWidth = 1;
  }

  function drawAllHeaders(){
    const startBar = loopStartChunk * chunkBars + 1;

    drawHeader(barCtx, selectedSteps, startBar, selectedBars);
    if (toggleBass.checked) drawHeader(bassHeaderCtx, selectedSteps, startBar, selectedBars);
    if (toggleChords.checked) drawHeader(chordHeaderCtx, selectedSteps, startBar, selectedBars);

    // drums header ALWAYS 4 bars
    drawHeader(drumHeaderCtx, drumColsStorage, 1, 4, { clear:true, fillBg:true });

    // red region (fill only, no outline)
    const redW = drumVisibleSteps * stepPx;
    drumHeaderCtx.save();
    drumHeaderCtx.fillStyle = 'rgba(255, 0, 0, 0.13)';
    drumHeaderCtx.fillRect(0, 0, redW, 32);
    drumHeaderCtx.restore();

    // re-draw header text on top
    drawHeader(drumHeaderCtx, drumColsStorage, 1, 4, { clear:false, fillBg:false });
  }

  // =========================
  // Drawing
  // =========================
  function paintBeatBands(ctx, totalSteps, height){
    const a = cssVar('--beatA') || '#fff';
    const b = cssVar('--beatB') || '#f2f2f2';
    for (let c=0; c<totalSteps; c+=beatSteps){
      const bandIndex = Math.floor(c / beatSteps);
      ctx.fillStyle = (bandIndex % 2 === 0) ? a : b;
      ctx.fillRect(c*stepPx, 0, beatSteps*stepPx, height);
    }
  }

  // subtle selection rectangle
  function drawSelectionOverlay(ctx, gridName){
    const b = selectionBounds(gridName);
    if (!b) return;

    const x = b.minC * stepPx;
    const y = b.minR * rowH;
    const w = (b.maxC - b.minC + 1) * stepPx;
    const h = (b.maxR - b.minR + 1) * rowH;

    ctx.save();
    ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
    ctx.fillRect(x, y, w, h);

    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x + 0.75, y + 0.75, Math.max(0, w - 1.5), Math.max(0, h - 1.5));
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawGrid({
    ctx, canvasW, canvasH,
    rows, cols,
    gridData, rowNotes,
    playheadGlobalStep = null,
    isDrum = false,
    gridName = 'melody'
  }){
    ctx.clearRect(0,0,canvasW,canvasH);
    paintBeatBands(ctx, cols, canvasH);

    // drums: grey-out beyond selected loop length (visual only)
    if (isDrum && drumVisibleSteps < cols){
      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillRect(drumVisibleSteps * stepPx, 0, (cols - drumVisibleSteps) * stepPx, canvasH);
      ctx.restore();
    }

    const gridCol = cssVar('--grid') || '#ccc';
    const barLine = cssVar('--barLine') || '#9fb5ff';
    const start = isDrum ? 0 : loopStartStep();

    ctx.strokeStyle = gridCol;
    ctx.lineWidth = 1;

    for (let r=0; r<rows; r++){
      for (let local=0; local<cols; local++){
        ctx.strokeRect(local*stepPx, r*rowH, stepPx, rowH);

        if (!gridData) continue;

        if (!isDrum){
          const global = start + local;
          if (global < melodyColsTotal && gridData[r][global]){
            const note = rowNotes[r];
            const fill = colorForNote(note);

            ctx.fillStyle = fill;
            ctx.fillRect(local*stepPx + 2, r*rowH + 2, stepPx - 4, rowH - 4);

            const text = labelForCell(note, false);
            if (text){
              const tcol = bestTextColorOn(fill);
              drawGridText(ctx, text, local*stepPx + stepPx/2, r*rowH + rowH/2, tcol);
            }
          }
        } else {
          if (gridData[r][local]){
            const name = rowNotes[r];
            const fill = colorForDrum(name);

            ctx.fillStyle = fill;
            ctx.fillRect(local*stepPx + 2, r*rowH + 2, stepPx - 4, rowH - 4);

            const text = labelForCell(name, true);
            if (text){
              const tcol = bestTextColorOn(fill);
              drawGridText(ctx, text, local*stepPx + stepPx/2, r*rowH + rowH/2, tcol);
            }
          }
        }
      }
    }

    // thick bar-start line
    ctx.strokeStyle = barLine;
    ctx.lineWidth = 4;
    for (let local=0; local<cols; local+=stepsPerBar){
      const x = local * stepPx;
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x,canvasH);
      ctx.stroke();
    }
    ctx.lineWidth = 1;

    // playhead (not drums)
    if (!isDrum && playheadGlobalStep !== null && Number.isFinite(playheadGlobalStep)){
      const s = loopStartStep();
      const e = s + cols;
      if (playheadGlobalStep >= s && playheadGlobalStep < e){
        const local = playheadGlobalStep - s;
        const x = clamp(local * stepPx, 0, canvasW);
        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,canvasH);
        ctx.strokeStyle = '#ff3b30';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.lineWidth = 1;
      }
    }

    drawSelectionOverlay(ctx, gridName);
  }

  // =========================
  // Modules visibility
  // =========================
  function updateModuleVisibility(){
    bassSection.style.display = toggleBass.checked ? '' : 'none';
    chordsSection.style.display = toggleChords.checked ? '' : 'none';
    drawAll();
  }

  // =========================
  // Draw all
  // =========================
  function drawAll(){
    renderAllLabels();
    drawAllHeaders();

    drawGrid({
      ctx: melodyCtx, canvasW: melodyCanvas.width, canvasH: melodyCanvas.height,
      rows: melodyRows, cols: selectedSteps,
      gridData: melodyData, rowNotes: notes,
      gridName: 'melody'
    });

    if (toggleBass.checked){
      drawGrid({
        ctx: bassCtx, canvasW: bassCanvas.width, canvasH: bassCanvas.height,
        rows: bassNotes.length, cols: selectedSteps,
        gridData: bassData, rowNotes: bassNotes,
        gridName: 'bass'
      });
    }

    if (toggleChords.checked){
      drawGrid({
        ctx: chordCtx, canvasW: chordCanvas.width, canvasH: chordCanvas.height,
        rows: chordRows, cols: selectedSteps,
        gridData: chordData, rowNotes: chordNotes,
        gridName: 'chords'
      });
    }

    drawGrid({
      ctx: drumCtx, canvasW: drumCanvas.width, canvasH: drumCanvas.height,
      rows: drumNames.length, cols: drumColsStorage,
      gridData: drumData, rowNotes: drumNames,
      isDrum: true, gridName: 'drums'
    });
  }

  // =========================
  // Drums
  // =========================
  function noiseBuffer(durationSec=0.2){
    const sr = audioCtx.sampleRate;
    const len = Math.max(1, Math.floor(sr * durationSec));
    const buffer = audioCtx.createBuffer(1, len, sr);
    const data = buffer.getChannelData(0);
    for (let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
    return buffer;
  }

  function playKick(time){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, time);
    osc.frequency.exponentialRampToValueAtTime(50, time + 0.12);

    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(1.0, time + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.25);

    osc.connect(gain);
    gain.connect(drumBus);

    duckGain.gain.cancelScheduledValues(time);
    duckGain.gain.setValueAtTime(1, time);
    duckGain.gain.linearRampToValueAtTime(0.68, time + 0.01);
    duckGain.gain.linearRampToValueAtTime(1, time + 0.14);

    osc.start(time);
    osc.stop(time + 0.3);
    registerNode(osc);
    return osc;
  }

  function playSnare(time){
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer(0.18);

    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'highpass';
    noiseFilter.frequency.setValueAtTime(900, time);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.0001, time);
    noiseGain.gain.exponentialRampToValueAtTime(0.9, time + 0.005);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200, time);

    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.0001, time);
    oscGain.gain.exponentialRampToValueAtTime(0.3, time + 0.005);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.12);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(drumBus);

    osc.connect(oscGain);
    oscGain.connect(drumBus);

    noise.start(time);
    noise.stop(time + 0.2);
    osc.start(time);
    osc.stop(time + 0.15);

    registerNode(noise);
    registerNode(osc);
    return {noise, osc};
  }

  function playHiHat(time){
    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer(0.08);

    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(5000, time);

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(0.6, time + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);

    noise.connect(hp);
    hp.connect(gain);
    gain.connect(drumBus);

    noise.start(time);
    noise.stop(time + 0.09);

    registerNode(noise);
    return noise;
  }

  function previewDrum(rowIndex){
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const name = drumNames[rowIndex];
    if (name === 'Kick') playKick(t);
    if (name === 'Snare') playSnare(t);
    if (name === 'Hi-hat') playHiHat(t);
  }

  // =========================
  // Synth
  // =========================
  function playTone(freq, startTime, duration, destinationBus, peak=0.8){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq;

    const attack = 0.01;
    const d = Math.max(0.001, duration);

    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(peak, startTime + attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + d);

    osc.connect(gain);
    gain.connect(destinationBus);

    osc.start(startTime);
    osc.stop(startTime + d + 0.02);

    registerNode(osc);
    return osc;
  }

  function previewTone(note, bus, peak){
    const f = frequencies[note];
    if (typeof f !== 'number') return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playTone(f, audioCtx.currentTime, 0.22, bus, peak);
  }

  // =========================
  // Steps + scheduling
  // =========================
  function monoStepsFromGrid(gridData, rowNotes){
    const out = [];
    for (let c=0; c<melodyColsTotal; c++){
      let found = false;
      for (let r=0; r<gridData.length; r++){
        if (gridData[r][c]){
          out.push(rowNotes[r]);
          found = true;
          break;
        }
      }
      if (!found) out.push('REST');
    }
    return out;
  }

  function polyStepsFromGrid(gridData){
    const out = [];
    for (let c=0; c<melodyColsTotal; c++){
      const notesHere = [];
      for (let r=0; r<gridData.length; r++){
        if (gridData[r][c]) notesHere.push(chordNotes[r]);
      }
      out.push(notesHere);
    }
    return out;
  }

  function scheduleLegatoMono(steps, startStep, endStep, stepDur, startAudioTime, bus, peak){
    for (let i=startStep; i<endStep; i++){
      const n = steps[i];
      if (n === 'REST') continue;

      let j = i + 1;
      while (j < endStep && steps[j] === 'REST') j++;

      const durSteps = (j < endStep) ? (j - i) : (endStep - i);
      const durSec = durSteps * stepDur;
      const f = frequencies[n];

      if (typeof f === 'number'){
        const t = startAudioTime + (i - startStep) * stepDur;
        playTone(f, t, Math.max(0.02, durSec * 0.995), bus, peak);
      }
      i = j - 1;
    }
  }

  function scheduleLegatoPoly(polySteps, startStep, endStep, stepDur, startAudioTime, bus, peak){
    for (let i=startStep; i<endStep; i++){
      const notesHere = polySteps[i];
      if (!notesHere || notesHere.length === 0) continue;

      let j = i + 1;
      while (j < endStep && (!polySteps[j] || polySteps[j].length === 0)) j++;

      const durSteps = (j < endStep) ? (j - i) : (endStep - i);
      const durSec = durSteps * stepDur;
      const t = startAudioTime + (i - startStep) * stepDur;

      for (const n of notesHere){
        const f = frequencies[n];
        if (typeof f === 'number'){
          playTone(f, t, Math.max(0.02, durSec * 0.995), bus, peak);
        }
      }
      i = j - 1;
    }
  }

  function scheduleOneLoop(packs, stepDur, startAudioTime){
    const startStep = loopStartStep();
    const endStep = loopEndStepExclusive();

    scheduleLegatoMono(packs.melodySteps, startStep, endStep, stepDur, startAudioTime, melodyBus, 0.72);

    if (toggleBass.checked){
      scheduleLegatoMono(packs.bassSteps, startStep, endStep, stepDur, startAudioTime, bassBus, 0.42);
    }

    if (toggleChords.checked){
      scheduleLegatoPoly(packs.chordSteps, startStep, endStep, stepDur, startAudioTime, chordBus, 0.16);
    }

    const dBars = drumLoopBars();
    const dSteps = dBars * stepsPerBar;

    let t = startAudioTime;
    for (let i=startStep; i<endStep; i++){
      const di = (i - startStep) % dSteps;
      if (drumData[0][di]) playHiHat(t);
      if (drumData[1][di]) playSnare(t);
      if (drumData[2][di]) playKick(t);
      t += stepDur;
    }
  }

  function animatePlayhead(stepDur, packs){
    const loopSteps = loopEndStepExclusive() - loopStartStep();
    const loopDuration = loopSteps * stepDur;

    const tick = () => {
      if (!isPlaying) return;

      const elapsed = audioCtx.currentTime - playStartAudio;
      if (elapsed >= loopDuration){
        playStartAudio += loopDuration;
        scheduleOneLoop(packs, stepDur, playStartAudio);
      }

      const loopElapsed = audioCtx.currentTime - playStartAudio;
      const headGlobal = loopStartStep() + (loopElapsed / stepDur);

      drawAllHeaders();

      drawGrid({
        ctx: melodyCtx, canvasW: melodyCanvas.width, canvasH: melodyCanvas.height,
        rows: melodyRows, cols: selectedSteps,
        gridData: melodyData, rowNotes: notes,
        playheadGlobalStep: headGlobal,
        gridName: 'melody'
      });

      if (toggleBass.checked){
        drawGrid({
          ctx: bassCtx, canvasW: bassCanvas.width, canvasH: bassCanvas.height,
          rows: bassNotes.length, cols: selectedSteps,
          gridData: bassData, rowNotes: bassNotes,
          playheadGlobalStep: headGlobal,
          gridName: 'bass'
        });
      }

      if (toggleChords.checked){
        drawGrid({
          ctx: chordCtx, canvasW: chordCanvas.width, canvasH: chordCanvas.height,
          rows: chordRows, cols: selectedSteps,
          gridData: chordData, rowNotes: chordNotes,
          playheadGlobalStep: headGlobal,
          gridName: 'chords'
        });
      }

      drawGrid({
        ctx: drumCtx, canvasW: drumCanvas.width, canvasH: drumCanvas.height,
        rows: drumNames.length, cols: drumColsStorage,
        gridData: drumData, rowNotes: drumNames,
        isDrum: true, gridName: 'drums'
      });

      const dSteps = drumLoopBars() * stepsPerBar;
      const drumHead = (headGlobal - loopStartStep()) % dSteps;

      if (Number.isFinite(drumHead)){
        const x = clamp(drumHead * stepPx, 0, drumCanvas.width);
        drumCtx.beginPath();
        drumCtx.moveTo(x,0);
        drumCtx.lineTo(x,drumCanvas.height);
        drumCtx.strokeStyle = '#ff3b30';
        drumCtx.lineWidth = 3;
        drumCtx.stroke();
        drumCtx.lineWidth = 1;
      }

      const xPx = (headGlobal - loopStartStep()) * stepPx;
      followPlayhead(melodyScroll, xPx);
      if (toggleBass.checked) followPlayhead(bassScroll, xPx);
      if (toggleChords.checked) followPlayhead(chordScroll, xPx);
      followPlayhead(drumScroll, (drumHead || 0) * stepPx);

      animationId = requestAnimationFrame(tick);
    };

    animationId = requestAnimationFrame(tick);
  }

  // =========================
  // Public controls
  // =========================
  function playAll(){
    if (audioCtx.state === 'suspended') audioCtx.resume();
    stopAllAudio();

    const packs = {
      melodySteps: monoStepsFromGrid(melodyData, notes),
      bassSteps: monoStepsFromGrid(bassData, bassNotes),
      chordSteps: polyStepsFromGrid(chordData)
    };

    const stepDur = stepDurSec();

    isPlaying = true;
    playBtn.disabled = true;
    stopBtn.disabled = false;

    loopStartSelect.disabled = true;
    loopEndSelect.disabled = true;
    drumLoopSelect.disabled = true;

    playStartAudio = audioCtx.currentTime;
    scheduleOneLoop(packs, stepDur, playStartAudio);
    animatePlayhead(stepDur, packs);
  }

  function stopPlayback(){
    stopAllAudio();
    isPlaying = false;
    playBtn.disabled = false;
    stopBtn.disabled = true;

    loopStartSelect.disabled = false;
    loopEndSelect.disabled = false;
    drumLoopSelect.disabled = false;

    if (animationId){
      cancelAnimationFrame(animationId);
      animationId = null;
    }

    drawAll();
  }

  function clearAll(){
    stopPlayback();
    for (let r=0; r<melodyRows; r++) melodyData[r].fill(false);
    for (let r=0; r<bassNotes.length; r++) bassData[r].fill(false);
    for (let r=0; r<chordRows; r++) chordData[r].fill(false);
    for (let r=0; r<drumNames.length; r++) drumData[r].fill(false);

    clearSelection('melody');
    clearSelection('bass');
    clearSelection('chords');
    clearSelection('drums');

    drawAll();
  }

  // =========================
  // Traditional selection / copy / paste / delete + drag-move + alt-duplicate
  // =========================
  function isOn(gridName, r, localCol){
    if (gridName === 'melody'){
      const g = loopStartStep() + localCol;
      return !!melodyData[r]?.[g];
    }
    if (gridName === 'bass'){
      const g = loopStartStep() + localCol;
      return !!bassData[r]?.[g];
    }
    if (gridName === 'chords'){
      const g = loopStartStep() + localCol;
      return !!chordData[r]?.[g];
    }
    if (gridName === 'drums'){
      return !!drumData[r]?.[localCol];
    }
    return false;
  }

  function toggleMonoCell(gridData, rows, col, row){
    gridData[row][col] = !gridData[row][col];
    if (gridData[row][col]){
      for (let rr=0; rr<rows; rr++){
        if (rr !== row) gridData[rr][col] = false;
      }
      return true;
    }
    return false;
  }

  function setOff(gridName, r, localCol){
    if (gridName === 'melody'){
      const g = loopStartStep() + localCol;
      if (melodyData[r]) melodyData[r][g] = false;
    } else if (gridName === 'bass'){
      const g = loopStartStep() + localCol;
      if (bassData[r]) bassData[r][g] = false;
    } else if (gridName === 'chords'){
      const g = loopStartStep() + localCol;
      if (chordData[r]) chordData[r][g] = false;
    } else if (gridName === 'drums'){
      if (drumData[r]) drumData[r][localCol] = false;
    }
  }

  function setOn(gridName, r, localCol){
    if (gridName === 'melody'){
      const g = loopStartStep() + localCol;
      toggleMonoCell(melodyData, melodyRows, g, r);
    } else if (gridName === 'bass'){
      const g = loopStartStep() + localCol;
      toggleMonoCell(bassData, bassNotes.length, g, r);
    } else if (gridName === 'chords'){
      const g = loopStartStep() + localCol;
      chordData[r][g] = true;
    } else if (gridName === 'drums'){
      drumData[r][localCol] = true;
    }
  }

  function canvasCellFromEvent(e, canvas, cols, rows){
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = clamp(Math.floor(x / stepPx), 0, cols - 1);
    const r = clamp(Math.floor(y / rowH), 0, rows - 1);
    return {r,c};
  }

  // Traditional: selection rectangle includes ALL cells
  function addRectSelection(gridName, r0, c0, r1, c1, additive){
    const minR = Math.min(r0,r1), maxR = Math.max(r0,r1);
    const minC = Math.min(c0,c1), maxC = Math.max(c0,c1);

    if (!additive) sel[gridName].clear();
    for (let r=minR; r<=maxR; r++){
      for (let c=minC; c<=maxC; c++){
        sel[gridName].add(keyOf(r,c));
      }
    }
  }

  // moving helpers
  function snapshotRegion(grid){
    const b = selectionBounds(grid);
    if (!b) return null;

    const w = b.maxC - b.minC + 1;
    const h = b.maxR - b.minR + 1;

    const matrix = Array.from({ length: h }, () => Array(w).fill(false));
    for (let rr = 0; rr < h; rr++){
      for (let cc = 0; cc < w; cc++){
        matrix[rr][cc] = isOn(grid, b.minR + rr, b.minC + cc);
      }
    }
    return { ...b, w, h, matrix };
  }

  function clearRegion(grid, snap){
    for (let rr = 0; rr < snap.h; rr++){
      for (let cc = 0; cc < snap.w; cc++){
        setOff(grid, snap.minR + rr, snap.minC + cc);
      }
    }
  }

  function stampRegion(grid, snap, anchorR, anchorC){
    const rows = rowsForGrid(grid);
    const cols = colsForGrid(grid);

    sel[grid].clear();
    for (let rr = 0; rr < snap.h; rr++){
      for (let cc = 0; cc < snap.w; cc++){
        const r = anchorR + rr;
        const c = anchorC + cc;
        if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
        if (snap.matrix[rr][cc]) setOn(grid, r, c);
        sel[grid].add(keyOf(r,c));
      }
    }
  }

  // select OR drag-move (alt = duplicate)
  function attachSelectBehavior({gridName, canvas, rowsGetter, colsGetter, onClickToggle}){
    let dragging = false;
    let moved = false;

    let start = null;

    let moving = false;
    let moveSnap = null;
    let moveAnchor = null;
    let moveOffset = {dr:0, dc:0};

    let moveCopy = false; // alt-drag duplicates
    let lastAlt = false;

    canvas.addEventListener('mousedown', (e) => {
      if (isPlaying) return;
      setActiveGrid(gridName);

      const rows = rowsGetter();
      const cols = colsGetter();
      const cell = canvasCellFromEvent(e, canvas, cols, rows);

      lastCell[gridName] = { r: cell.r, c: cell.c };

      dragging = true;
      moved = false;
      start = cell;

      // start moving if clicking inside selection (and not shift)
      if (!e.shiftKey && isCellInSelection(gridName, cell.r, cell.c)) {
        const snap = snapshotRegion(gridName);
        if (snap) {
          moving = true;
          moveSnap = snap;
          moveAnchor = { r: snap.minR, c: snap.minC };
          moveOffset = { dr: 0, dc: 0 };
          moveCopy = !!e.altKey;
          lastAlt = !!e.altKey;
        }
        return;
      }

      // otherwise start/replace selection
      moving = false;
      moveSnap = null;
      moveAnchor = null;
      moveOffset = {dr:0, dc:0};
      moveCopy = false;
      lastAlt = false;

      if (!e.shiftKey) sel[gridName].clear();
      sel[gridName].add(keyOf(cell.r, cell.c));
      drawAll();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!dragging || isPlaying) return;
      lastAlt = !!e.altKey;

      const rows = rowsGetter();
      const cols = colsGetter();
      const cell = canvasCellFromEvent(e, canvas, cols, rows);

      if (start && (cell.r !== start.r || cell.c !== start.c)) moved = true;

      // moving selection
      if (moving && moveSnap) {
        const dr = cell.r - start.r;
        const dc = cell.c - start.c;

        const maxR = rows - moveSnap.h;
        const maxC = cols - moveSnap.w;

        const newAnchorR = clamp(moveAnchor.r + dr, 0, Math.max(0, maxR));
        const newAnchorC = clamp(moveAnchor.c + dc, 0, Math.max(0, maxC));

        moveOffset = { dr: newAnchorR - moveAnchor.r, dc: newAnchorC - moveAnchor.c };

        // preview selection box at new spot
        sel[gridName].clear();
        for (let rr = 0; rr < moveSnap.h; rr++){
          for (let cc = 0; cc < moveSnap.w; cc++){
            sel[gridName].add(keyOf(newAnchorR + rr, newAnchorC + cc));
          }
        }
        drawAll();
        return;
      }

      // selecting rectangle
      addRectSelection(gridName, start.r, start.c, cell.r, cell.c, e.shiftKey);
      drawAll();
    });

    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;

      // finish move: commit
      if (moving && moveSnap) {
        const finalAnchorR = moveAnchor.r + moveOffset.dr;
        const finalAnchorC = moveAnchor.c + moveOffset.dc;

        if (moveOffset.dr !== 0 || moveOffset.dc !== 0) {
          // ALT = duplicate (do not clear original)
          if (!(lastAlt || moveCopy)) {
            clearRegion(gridName, moveSnap);
          }
          stampRegion(gridName, moveSnap, finalAnchorR, finalAnchorC);
        } else {
          // restore original selection
          sel[gridName].clear();
          for (let rr = 0; rr < moveSnap.h; rr++){
            for (let cc = 0; cc < moveSnap.w; cc++){
              sel[gridName].add(keyOf(moveSnap.minR + rr, moveSnap.minC + cc));
            }
          }
        }

        moving = false;
        moveSnap = null;
        moveAnchor = null;
        moveOffset = {dr:0, dc:0};
        moveCopy = false;
        lastAlt = false;

        drawAll();
        return;
      }

      // click (no drag): toggle note
      if (!moved && start) {
        if (onClickToggle) onClickToggle(start.r, start.c);
        sel[gridName].clear();
        sel[gridName].add(keyOf(start.r, start.c));
        drawAll();
      }
    });
  }

  attachSelectBehavior({
    gridName:'melody',
    canvas: melodyCanvas,
    rowsGetter: () => melodyRows,
    colsGetter: () => selectedSteps,
    onClickToggle: (r,c) => {
      const g = loopStartStep() + c;
      const turnedOn = toggleMonoCell(melodyData, melodyRows, g, r);
      if (turnedOn) previewTone(notes[r], melodyBus, 0.75);
    }
  });

  attachSelectBehavior({
    gridName:'bass',
    canvas: bassCanvas,
    rowsGetter: () => bassNotes.length,
    colsGetter: () => selectedSteps,
    onClickToggle: (r,c) => {
      if (!toggleBass.checked) return;
      const g = loopStartStep() + c;
      const turnedOn = toggleMonoCell(bassData, bassNotes.length, g, r);
      if (turnedOn) previewTone(bassNotes[r], bassBus, 0.50);
    }
  });

  attachSelectBehavior({
    gridName:'chords',
    canvas: chordCanvas,
    rowsGetter: () => chordRows,
    colsGetter: () => selectedSteps,
    onClickToggle: (r,c) => {
      if (!toggleChords.checked) return;
      const g = loopStartStep() + c;
      chordData[r][g] = !chordData[r][g];
      if (chordData[r][g]){
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const n = chordNotes[r];
        const f = frequencies[n];
        if (typeof f === 'number') playTone(f, t, 0.35, chordBus, 0.16);
      }
    }
  });

  attachSelectBehavior({
    gridName:'drums',
    canvas: drumCanvas,
    rowsGetter: () => drumNames.length,
    colsGetter: () => drumColsStorage,
    onClickToggle: (r,c) => {
      drumData[r][c] = !drumData[r][c];
      if (drumData[r][c]) previewDrum(r);
    }
  });

  // copy/paste/delete (rectangular)
  function copySelection(){
    const grid = activeGrid;
    const b = selectionBounds(grid);
    if (!b) return;

    const rows = rowsForGrid(grid);
    const cols = colsForGrid(grid);

    const w = b.maxC - b.minC + 1;
    const h = b.maxR - b.minR + 1;

    const matrix = Array.from({ length: h }, () => Array(w).fill(false));
    for (let rr=0; rr<h; rr++){
      for (let cc=0; cc<w; cc++){
        const r = b.minR + rr;
        const c = b.minC + cc;
        if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
        matrix[rr][cc] = isOn(grid, r, c);
      }
    }
    clipboard = { gridType:grid, w, h, matrix };
  }

  function pasteSelection(){
    if (!clipboard) return;
    const grid = clipboard.gridType;

    const rows = rowsForGrid(grid);
    const cols = colsForGrid(grid);

    const anchor = lastCell[grid] || { r: 0, c: 0 };

    // overwrite destination area first
    for (let rr=0; rr<clipboard.h; rr++){
      for (let cc=0; cc<clipboard.w; cc++){
        const r = anchor.r + rr;
        const c = anchor.c + cc;
        if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
        setOff(grid, r, c);
      }
    }

    sel[grid].clear();
    for (let rr=0; rr<clipboard.h; rr++){
      for (let cc=0; cc<clipboard.w; cc++){
        const r = anchor.r + rr;
        const c = anchor.c + cc;
        if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
        if (clipboard.matrix[rr][cc]) setOn(grid, r, c);
        sel[grid].add(keyOf(r,c));
      }
    }
    drawAll();
  }

  function deleteSelection(){
    const grid = activeGrid;
    if (!sel[grid] || sel[grid].size === 0) return;

    for (const k of sel[grid]){
      const {r,c} = parseKey(k);
      setOff(grid, r, c);
    }
    sel[grid].clear();
    drawAll();
  }

  // =========================
  // Keyboard shortcuts
  // =========================
  document.addEventListener('keydown', (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName : '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

    // Space: play/stop
    if (e.code === 'Space'){
      e.preventDefault();
      if (!isPlaying) playAll();
      else stopPlayback();
      return;
    }

    // Delete/backspace: delete selected region
    if (e.code === 'Delete' || e.code === 'Backspace'){
      e.preventDefault();
      if (!isPlaying) deleteSelection();
      return;
    }

    const isMac = navigator.platform.toUpperCase().includes('MAC');
    const mod = isMac ? e.metaKey : e.ctrlKey;

    if (mod && e.code === 'KeyC'){
      e.preventDefault();
      if (!isPlaying) copySelection();
      return;
    }
    if (mod && e.code === 'KeyV'){
      e.preventDefault();
      if (!isPlaying) pasteSelection();
      return;
    }
  });

  // =========================
  // Save / Load
  // =========================
  function safeClone2D(arr, rows, cols){
    // ensure shape and booleans
    const out = Array.from({ length: rows }, (_, r) =>
      Array.from({ length: cols }, (_, c) => !!(arr?.[r]?.[c]))
    );
    return out;
  }

  function saveProject(){
    const payload = {
      version: 1,
      savedAt: new Date().toISOString(),
      settings: {
        tempo: Number(tempoSlider.value),
        range: rangeSelect.value,
        loopStartChunk,
        loopEndChunk,
        drumLoopBars: Number(drumLoopSelect.value),
        showBass: !!toggleBass.checked,
        showChords: !!toggleChords.checked
      },
      data: {
        notes: notes.slice(),
        melodyData: melodyData,
        bassData: bassData,
        chordData: chordData,
        drumData: drumData
      }
    };

    const json = JSON.stringify(payload);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-');
    a.href = url;
    a.download = `kids-melody-maker-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);
  }

  function loadProject(){
    fileInput.value = '';
    fileInput.click();
  }

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      try{
        const payload = JSON.parse(String(reader.result || ''));

        stopPlayback();

        const s = payload?.settings || {};
        const d = payload?.data || {};

        // settings
        if (Number.isFinite(Number(s.tempo))) {
          tempoSlider.value = String(Number(s.tempo));
          tempoValue.textContent = String(Number(s.tempo));
        }

        if (typeof s.range === 'string' && rangeModes[s.range]) {
          rangeSelect.value = s.range;
        }

        if (typeof s.showBass === 'boolean') toggleBass.checked = s.showBass;
        if (typeof s.showChords === 'boolean') toggleChords.checked = s.showChords;

        if ([1,2,3,4].includes(Number(s.drumLoopBars))) {
          drumLoopSelect.value = String(Number(s.drumLoopBars));
        }

        // loop chunk selection
        const ls = clamp(Number(s.loopStartChunk ?? 0), 0, chunksTotal - 1);
        const le = clamp(Number(s.loopEndChunk ?? 0), 0, chunksTotal - 1);
        loopStartChunk = ls;
        loopEndChunk = Math.max(ls, le);
        loopStartSelect.value = String(loopStartChunk);
        loopEndSelect.value = String(loopEndChunk);

        // notes/range data
        const loadedNotes = Array.isArray(d.notes) ? d.notes.filter(x => typeof x === 'string') : null;
        if (loadedNotes && loadedNotes.length >= 4) {
          notes = loadedNotes.slice();
        } else {
          // fall back to selected range
          notes = (rangeModes[rangeSelect.value] || rangeModes.oneOctave).slice();
        }

        melodyRows = notes.length;
        chordNotes = notes;
        chordRows = chordNotes.length;

        // data (shape-correct)
        melodyData = safeClone2D(d.melodyData, melodyRows, melodyColsTotal);
        bassData   = safeClone2D(d.bassData, bassNotes.length, melodyColsTotal);
        chordData  = safeClone2D(d.chordData, chordRows, melodyColsTotal);
        drumData   = safeClone2D(d.drumData, drumNames.length, drumColsStorage);

        // clear selections
        clearSelection('melody'); clearSelection('bass'); clearSelection('chords'); clearSelection('drums');

        updateSelectionRange();
        applyCanvasSizes();
        updateModuleVisibility();
        drawAll();
      } catch(err){
        alert('Could not load this file. (Not a valid Kids Melody Maker save.)');
      }
    };

    reader.readAsText(file);
  });

  // =========================
  // UI wiring
  // =========================
  tempoSlider.addEventListener('input', () => {
    tempoValue.textContent = tempoSlider.value;
  });

  toggleBass.addEventListener('change', updateModuleVisibility);
  toggleChords.addEventListener('change', updateModuleVisibility);

  drumLoopSelect.addEventListener('change', () => {
    if (isPlaying) return;
    applyCanvasSizes();
    drawAll();
  });

  rangeSelect.addEventListener('change', () => setRange(rangeSelect.value));

  function setRange(mode){
    notes = (rangeModes[mode] || rangeModes.oneOctave).slice();
    melodyRows = notes.length;
    chordNotes = notes;
    chordRows = chordNotes.length;

    melodyData = Array.from({length: melodyRows}, () => Array(melodyColsTotal).fill(false));
    chordData  = Array.from({length: chordRows}, () => Array(melodyColsTotal).fill(false));

    clearSelection('melody');
    clearSelection('chords');

    applyCanvasSizes();
    drawAll();
  }

  function makeChunkLabel(c){
    const start = c * chunkBars + 1;
    const end = start + chunkBars - 1;
    return `Bars ${start}-${end}`;
  }

  function fillChunkSelects(){
    loopStartSelect.innerHTML = '';
    loopEndSelect.innerHTML = '';
    for (let c=0; c<chunksTotal; c++){
      const o1 = document.createElement('option');
      o1.value = String(c);
      o1.textContent = makeChunkLabel(c);
      loopStartSelect.appendChild(o1);

      const o2 = document.createElement('option');
      o2.value = String(c);
      o2.textContent = makeChunkLabel(c);
      loopEndSelect.appendChild(o2);
    }
    loopStartSelect.value = String(loopStartChunk);
    loopEndSelect.value = String(loopEndChunk);
  }

  loopStartSelect.addEventListener('change', () => {
    setVisibleChunks(Number(loopStartSelect.value), loopEndChunk);
  });

  loopEndSelect.addEventListener('change', () => {
    setVisibleChunks(loopStartChunk, Number(loopEndSelect.value));
  });

  // =========================
  // Init
  // =========================
  toggleBass.checked = false;
  toggleChords.checked = false;

  fillChunkSelects();
  setVisibleChunks(0, 0);

  applyCanvasSizes();
  updateModuleVisibility();
  drawAll();

  // expose for buttons
  window.playAll = playAll;
  window.stopPlayback = stopPlayback;
  window.clearAll = clearAll;
  window.saveProject = saveProject;
  window.loadProject = loadProject;

})();
</script>
</body>
</html>
